# Daily data + predictions. Replaces the local launchd jobs.
#
# Missed snapshot days can't be recovered, so later steps still run when an
# earlier one fails, and the run is marked failed (GitHub emails you).
name: daily

on:
  schedule:
    # GitHub runs schedules on a best-effort basis: runs on the hour are often
    # delayed and sometimes dropped (2026-10-23's 07:00 run never started). So
    # avoid :00, and add a backup. The snapshot step skips itself if one was
    # taken in the last 6 hours, so the backup only snapshots when the first
    # run didn't happen; results and predictions just refresh.
    - cron: "17 6 * * *"   # 07:17 UK summer time, 06:17 winter
    - cron: "47 9 * * *"   # backup: 10:47 / 09:47, still before an 11:00 deadline
  workflow_dispatch:

concurrency:
  group: fpl-database
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENTRY_ID: ${{ secrets.ENTRY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Snapshot (prices, injury flags, ownership) and your squad
        run: make ingest-daily ingest-squad

      - name: Match results
        if: ${{ !cancelled() }}
        run: make ingest-results

      - name: Team strength and expected points
        if: ${{ !cancelled() }}
        run: make strength-current xp xp-actuals

      - name: Prune superseded model runs
        if: ${{ !cancelled() }}
        run: make prune

      - name: Today's advice (shown on the run's summary page)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail  # so an optimiser crash fails the step despite grep
          {
            echo "## Squad advice — $(date -u +%A\ %d\ %B)"
            echo '```text'
            uv run python -m fantasy_26.optimise.squad --no-save 2>&1 | grep -v '^INFO'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
