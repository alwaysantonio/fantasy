[project]
name = "fantasy-26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antonio Teixeira", email = "alwaysantonio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pulp>=3.3.2",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sqlalchemy>=2.0.52",
    "statsmodels>=0.14.6",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
fantasy-26 = "fantasy_26:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_26"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
